<div class="table-container">

    <table mat-table [dataSource]="items">
        <ng-container matColumnDef="pic">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let item">
                <img [src]="item.image" width="80" height="80">
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
        </ng-container>
    
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let item"> {{item.name}} </td>
            <td mat-footer-cell *matFooterCellDef>
                <b>Highest Value</b>
            </td>
        </ng-container>
    
        <ng-container matColumnDef="str">
            <th mat-header-cell *matHeaderCellDef>
                STR
            </th>
            <td mat-cell *matCellDef="let item">
                {{item.requirements.str}}
            </td>
            <td mat-footer-cell *matFooterCellDef>
                <b>{{highestStr}}</b>
            </td>
        </ng-container>
    
        <ng-container matColumnDef="dex">
            <th mat-header-cell *matHeaderCellDef>
                DEX
            </th>
            <td mat-cell *matCellDef="let item">
                {{item.requirements.dex}}
            </td>
            <td mat-footer-cell *matFooterCellDef>
                <b>{{highestDex}}</b>
            </td>
        </ng-container>
    
        <ng-container matColumnDef="int">
            <th mat-header-cell *matHeaderCellDef>
                INT
            </th>
            <td mat-cell *matCellDef="let item">
                {{item.requirements.int}}
            </td>
            <td mat-footer-cell *matFooterCellDef>
                <b>{{highestInt}}</b>
            </td>
        </ng-container>
    
        <ng-container matColumnDef="fai">
            <th mat-header-cell *matHeaderCellDef>
                FAI
            </th>
            <td mat-cell *matCellDef="let item">
                {{item.requirements.fai}}
            </td>
            <td mat-footer-cell *matFooterCellDef>
                <b>{{highestFai}}</b>
            </td>
        </ng-container>
    
        <ng-container matColumnDef="arc">
            <th mat-header-cell *matHeaderCellDef>
                ARC
            </th>
            <td mat-cell *matCellDef="let item">
                {{item.requirements.arc}}
            </td>
            <td mat-footer-cell *matFooterCellDef>
                <b>{{highestArc}}</b>
            </td>
        </ng-container>
    
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let item">
                <button matIconButton aria-label="Remove item" 
                    (click)="removeItem(item)"
                    matTooltip="Remove Item">
                    <mat-icon>close</mat-icon>
                </button>
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </table>
</div>
