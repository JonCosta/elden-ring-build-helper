<form [formGroup]="form" class="search-container">
    <mat-form-field appearance="outline" [floatLabel]="'always'">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Search</mat-label>
        <input matInput 
            placeholder="Type here to start searching"
            formControlName="name" 
            [matAutocomplete]="auto">
        <mat-autocomplete #auto="matAutocomplete"
            (optionSelected)="handleSelectedOption($event)">
            @for (item of searchedItems$ | async; track item) {
                <mat-option [value]="item">
                    {{item.name}}
                </mat-option>
            }
        </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline" [floatLabel]="'always'">
        <mat-label>Select a Category</mat-label>
        <mat-select formControlName="category">
            <mat-option value="weapons">Weapons</mat-option>
            <mat-option value="sorceries">Sorceries</mat-option>
            <mat-option value="incantations">Incantantions</mat-option>
            <mat-option value="shields">Shields</mat-option>
        </mat-select>
    </mat-form-field>
</form>
